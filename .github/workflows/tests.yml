name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js for frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Check Python compilation
        run: python -m compileall -q vibeguard tests

      - name: Check JavaScript syntax
        run: |
          node --check vibeguard/ui_assets/api.js
          node --check vibeguard/ui_assets/app.js
